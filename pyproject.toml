[tool.poetry]
name = "pycompressor"
version = "0.0.0"
description = "PDF set compressor"
authors = ["Your Name <you@example.com>"]
license = "GPL 3.0"
readme = "README.md"
classifiers = [
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
packages = [{ include = "pycompressor", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
numba = "^0.61.0"
numpy = "^2.1.0"
cma = "^4.0.0"
rich = "^13.9.4"
scipy = "^1.15.1"
tqdm = "^4.67.1"
matplotlib = "^3.10.0"

[tool.poetry.group.tests.dependencies]
pygit2 = "^1.17.0"
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
pytest-env = "^1.1.5"
semver = "^3.0.4"
pylint = "^3.3.4"

[tool.poetry.scripts]
pycomp = "pycompressor.scripts.main:main"
cmp-corr = "pycompressor.scripts.correlations:main"
cmp-dist = "pycompressor.scripts.distributions:main"
cmp-erfs = "pycompressor.scripts.compute_erfs:main"
cmp-fids = "pycompressor.scripts.fids:main"
get-grid = "pycompressor.scripts.compressed_set:main"
validate = "pycompressor.scripts.validate:main"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
metadata = true
dirty = true
semver = true

[tool.poetry-dynamic-versioning.files."src/pycompressor/_version.py"]
persistent-substitution = true
initial-content = """
__version__ = "0.0.0"
"""

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
